name: Build Release Zip

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(echo "$TAG" | grep -o '[0-9][0-9.]*' | head -1)
          if [ -z "$VER" ]; then VER="$TAG"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Build release zip
        run: |
          VER="${{ steps.version.outputs.ver }}"
          mkdir -p dist/Auggment-Scoreboard-$VER
          cp -r app.py score_details.py cfb_week.py install.sh start_kiosk.sh setup_kiosk_service.sh \
                requirements.txt requirements-tested.txt version.txt LICENSE README.md QC_REPORT.md \
                templates static scripts docs Images dist/Auggment-Scoreboard-$VER/
          (cd dist && zip -r "Auggment-Scoreboard-$VER.zip" "Auggment-Scoreboard-$VER")
          ls -la dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.ver }}"
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/Auggment-Scoreboard-$VER.zip" \
            --title "Auggment Scoreboard $VER" \
            --notes "Automated build for tag ${{ steps.version.outputs.tag }}."
