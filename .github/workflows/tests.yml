name: Scoreboard regression checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install development dependencies
        run: python -m pip install -r requirements.txt ruff==0.17.1
      - name: Python regressions and targeted lint
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q app.py score_details.py scripts tests
          ruff check --select F821,F822,F823 app.py score_details.py scripts tests
      - name: JavaScript and startup checks
        run: |
          node tests/clock.test.js
          node tests/display.test.js
          node tests/rank_badges.test.js
          node tests/scorecard_details.test.js
          node tests/live_widgets.test.js
          node --check tests/browser_qc.cjs
          bash -n install.sh
          bash -n start_kiosk.sh
          bash -n setup_kiosk_service.sh
      - name: Headless browser checks
        if: matrix.python == '3.12'
        run: |
          npm install --prefix /tmp/scoreboard-qc playwright@1.62.1
          python tests/serve_qc.py >/tmp/scoreboard-qc-server.log 2>&1 &
          qc_server_pid=$!
          trap 'kill "$qc_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:5002/api/ping && break
            sleep 1
          done
          QC_CHROMIUM="$(command -v google-chrome || command -v chromium)" NODE_PATH=/tmp/scoreboard-qc/node_modules node tests/browser_qc.cjs
          QC_CHROMIUM="$(command -v google-chrome || command -v chromium)" NODE_PATH=/tmp/scoreboard-qc/node_modules node tests/browser_update.cjs
          QC_CHROMIUM="$(command -v google-chrome || command -v chromium)" NODE_PATH=/tmp/scoreboard-qc/node_modules node tests/browser_live.cjs
      - name: Keep browser screenshots
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-browser-qc
          path: |
            /tmp/scoreboard-qc-*.png
            /tmp/scoreboard-live-*.png
