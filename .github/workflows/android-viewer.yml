name: Android server-connected viewer
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-viewer.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test pure Java URL and retry policy
        run: bash android/test.sh
      - name: Build and verify debug APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: auggmented-scoreboard-viewer-debug
          path: android/dist/auggmented-scoreboard-viewer-debug.apk
          retention-days: 30
