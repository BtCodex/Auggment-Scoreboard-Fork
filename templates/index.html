<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Gameday Scoreboard</title>
    <link id="font-link" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/display-modes.css">
</head>
<body class="pg-index display-{{ settings.display_mode | default('hybrid') }}">
    <header id="main-header">
        <div id="header-left">
            <span id="display-name">Scoreboard</span>
            <span id="header-sep">|</span>
            <span id="top-clock"></span>
        </div>
        <div id="weather">--</div>
    </header>


    <div class="stage" id="main-stage">
        <div class="slide active empty-slide" data-slide-key="empty">
            <div class="empty-state"><strong>GAMEDAY</strong><span>Loading scores…</span></div>
        </div>
    </div>


    <footer id="main-footer">
        <div class="ticker-wrap">
            <div class="ticker" id="ticker-text"><span class="ticker-segment">LOADING GAMEDAY FEED…</span></div>
        </div>
    </footer>


    <div id="connection-status" role="status" hidden></div>
    <script src="{{ url_for('static', filename='js/clock.js') }}"></script>
    <script src="{{ url_for('static', filename='js/display.js') }}"></script>
    <script>
        function updateScale() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const scale = Math.max(1, Math.min(vw / 1920, vh / 1080));
            document.documentElement.style.setProperty('--ui-scale', scale);
            document.documentElement.style.setProperty('--px', scale + 'px');
        }


        // ─── ORIENTATION ───
        let currentOrientation = 'auto';


        function applyOrientation(orientation) {
            currentOrientation = orientation;
            const isPortrait  = window.innerHeight > window.innerWidth;
            // Phone heuristic: portrait phones have width ≤ 600px; landscape phones flip so
            // innerWidth becomes the long side (> 600px) but innerHeight stays small (≤ 500px).
            // A rotated TV in landscape has height 1080px, well above 500px.
            const isPhone = window.innerWidth <= 600 || window.innerHeight <= 500;

            let useVertical = false;
            let usePhone    = false;

            if (orientation === 'vertical') {
                useVertical = true;
                if (isPhone) usePhone = true;   // scale for the actual screen, not a TV
            } else if (orientation === 'phone') {
                useVertical = true;
                usePhone    = true;
            } else if (orientation === 'auto') {
                if (isPortrait) {
                    useVertical = true;
                    if (isPhone) usePhone = true;
                } else if (isPhone) {
                    usePhone = true;            // landscape phone: apply phone scaling
                }
            }
            // 'horizontal' or auto-landscape non-phone: neither class set

            document.body.classList.toggle('vertical', useVertical);
            document.body.classList.toggle('phone',    usePhone);
        }


        window.addEventListener('resize', () => {
            updateScale(); applyOrientation(currentOrientation);
            resetTickerAnimation();
        });
        updateScale();
        applyOrientation('auto');
        // ─── CLOCK ───
        let clockFormat = {{ settings.clock_format | tojson }};
        let clockTimezone = {{ settings.timezone | tojson }};
        let _lastClockStr = '';
        function updateClock() {
            const hidden = clockFormat === 'hidden';
            document.getElementById('top-clock').hidden = hidden;
            document.getElementById('header-sep').hidden = hidden;
            const s = ScoreboardClock.format(new Date(), clockFormat, clockTimezone);
            if (s !== _lastClockStr) {
                _lastClockStr = s;
                document.getElementById('top-clock').textContent = s;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();


        // Automatic preserves the existing five-minute visible/hidden cycle.
        let headerVisibility = ScoreboardDisplay.normalizeHeaderVisibility({{ settings.header_visibility | default('auto') | tojson }});
        let automaticHeaderVisible = true;
        function applyHeaderVisibility(value) {
            headerVisibility = ScoreboardDisplay.normalizeHeaderVisibility(value);
            const mode = document.body.classList.contains('display-ticker') ? 'ticker' : 'scoreboard';
            const state = ScoreboardDisplay.headerState(headerVisibility, automaticHeaderVisible, mode);
            const header = document.getElementById('main-header');
            header.classList.toggle('hidden', !state.visible);
            header.setAttribute('aria-hidden', String(!state.visible));
            document.body.classList.toggle('header-hidden', state.collapsed);
            document.body.classList.toggle('header-always', headerVisibility === 'always');
        }
        applyHeaderVisibility(headerVisibility);
        setInterval(() => {
            automaticHeaderVisible = !automaticHeaderVisible;
            applyHeaderVisibility(headerVisibility);
        }, 5 * 60 * 1000);


        // ─── TICKER BORDER: static configured color, or a burn-in cycle ───
        const TICKER_COLORS = [
            '#099afc', // blue
            '#FFD600', // yellow
            '#FF6D00', // orange
            '#FF1744', // red
            '#E040FB', // purple
        ];
        let tickerColorIndex = 0;
        let tickerCycleTimer = null;

        function cycleTickerColor() {
            tickerColorIndex = (tickerColorIndex + 1) % TICKER_COLORS.length;
            document.getElementById('main-footer').style.borderTopColor = TICKER_COLORS[tickerColorIndex];
        }

        function applyTickerBorder(colors) {
            const footer = document.getElementById('main-footer');
            const base = (colors && colors.ticker_border) || '#099afc';
            TICKER_COLORS[0] = base;
            if (colors && colors.ticker_border_cycle === false) {
                if (tickerCycleTimer) { clearInterval(tickerCycleTimer); tickerCycleTimer = null; }
                footer.style.borderTopColor = base;
                return;
            }
            if (!tickerCycleTimer) {
                tickerColorIndex = 0;
                footer.style.borderTopColor = base;
                tickerCycleTimer = setInterval(cycleTickerColor, 175 * 1000);
            }
        }


        // Load whichever Google Font the user picked (Barlow is always loaded as fallback).
        let _loadedFont = '';
        function applyFontLink(name) {
            if (!name || name === _loadedFont) return;
            _loadedFont = name;
            const family = name.trim().replace(/\s+/g, '+');
            const url = `https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;600&family=${family}:wght@400;700;900&display=swap`;
            document.getElementById('font-link').href = url;
        }


        // ─── DATA ───
        let previousScores = {}; // key: eventId, value: score string for flash detection
        let currentSlideKey = 'empty';
        let slideTimer = null;
        let slideInterval = 13000;
        let lastTickerHtml = '';
        let settingsVersion = null;
        let appVersion = null;
        let displayMode = ScoreboardDisplay.normalizeMode({{ settings.display_mode | default('hybrid') | tojson }});
        let logoSlideInterval = 8000;
        let transitionDuration = 500;
        let dataPollTimer = null;
        let browserRefreshSeconds = 30;
        let lastSuccessfulFetch = 0;
        let logoProbeSource = '';
        let logoProbeReady = false;
        let logoProbePromise = null;
        let logoProbeAttemptAt = 0;

        function applyDisplayMode(mode) {
            const next = ScoreboardDisplay.normalizeMode(mode);
            if (displayMode !== next) {
                document.body.classList.remove('display-scoreboard', 'display-ticker', 'display-hybrid');
                displayMode = next;
            }
            document.body.classList.add('display-' + displayMode);
            applyHeaderVisibility(headerVisibility);
            if (displayMode === 'ticker') {
                if (slideTimer) clearTimeout(slideTimer);
                slideTimer = null;
            }
            resetTickerAnimation();
        }

        async function logoAvailable(data) {
            if (displayMode === 'ticker' || data.show_logo_slide === false || data.logo_available === false) return false;
            const source = '/static/uploads/logo.png?v=' + encodeURIComponent(data.logo_version || '');
            if (source === logoProbeSource && (logoProbeReady || logoProbePromise || Date.now() - logoProbeAttemptAt < 60000)) return logoProbePromise || logoProbeReady;
            logoProbeSource = source;
            logoProbeAttemptAt = Date.now();
            logoProbeReady = false;
            logoProbePromise = new Promise(resolve => {
                const image = new Image();
                const finish = ready => {
                    clearTimeout(timer);
                    image.onload = image.onerror = null;
                    if (logoProbeSource === source) logoProbeReady = ready;
                    resolve(ready);
                };
                const timer = setTimeout(() => finish(false), 3000);
                image.onload = () => finish(image.naturalWidth > 0);
                image.onerror = () => finish(false);
                image.src = source;
            });
            const ready = await logoProbePromise;
            logoProbePromise = null;
            return ready;
        }

        function removeBadLogo(image) {
            const slide = image.closest('.slide');
            if (!slide) return;
            logoProbeReady = false;
            const wasActive = slide.classList.contains('active');
            slide.remove();
            if (wasActive) {
                const next = document.querySelector('#main-stage .slide');
                if (next) { next.classList.add('active'); currentSlideKey = next.dataset.slideKey; }
            }
            ensureSlideshow();
        }

        // Ticker: pixel-driven marquee so speed stays constant regardless of
        // how much content is in the bar (CSS % animations drift as width changes).
        let tickerSpeed = 120;
        let tickerOffset = 0;
        const tickerElement = document.getElementById('ticker-text');


        function buildScoreText(awayScore, homeScore) {
            return `${awayScore}-${homeScore}`;
        }


        function patchStage(newEls) {
            const stage = document.getElementById('main-stage');
            const previousSlideKey = currentSlideKey;
            const existingByKey = new Map();
            for (const el of stage.children) {
                const k = el.dataset.slideKey;
                if (k) existingByKey.set(k, el);
            }
            const finalEls = newEls.map(newEl => {
                const k = newEl.dataset.slideKey;
                if (k && existingByKey.has(k)) {
                    const ex = existingByKey.get(k);
                    if (ex.innerHTML !== newEl.innerHTML) ex.innerHTML = newEl.innerHTML;
                    for (const attr of [...ex.attributes]) {
                        if (attr.name !== 'class' && !newEl.hasAttribute(attr.name)) ex.removeAttribute(attr.name);
                    }
                    for (const attr of newEl.attributes) {
                        if (attr.name !== 'class') ex.setAttribute(attr.name, attr.value);
                    }
                    return ex;
                }
                return newEl;
            });
            // Keep stable game nodes in place; avoid reloading unchanged image/iframe slides.
            if (stage.children.length !== finalEls.length || finalEls.some((el, index) => stage.children[index] !== el)) {
                stage.replaceChildren(...finalEls);
            }
            const activeEl = finalEls.find(el => el.dataset.slideKey === currentSlideKey);
            if (activeEl) {
                finalEls.forEach(el => el.classList.toggle('active', el === activeEl));
            } else if (finalEls.length) {
                finalEls.forEach(el => el.classList.remove('active'));
                finalEls[0].classList.add('active');
                currentSlideKey = finalEls[0].dataset.slideKey || '';
            }
            ensureSlideshow(previousSlideKey !== currentSlideKey);
        }

        function advanceSlide() {
            slideTimer = null;
            const slides = [...document.querySelectorAll('#main-stage .slide')];
            if (!slides.length || displayMode === 'ticker') return;
            const idx = slides.findIndex(slide => slide.classList.contains('active'));
            if (slides.length > 1 && idx !== -1) {
                const outgoing = slides[idx];
                outgoing.classList.remove('active');
                outgoing.classList.add('slide-exiting');
                setTimeout(() => outgoing.classList.remove('slide-exiting'), transitionDuration);
            }
            const incoming = slides[(idx + 1) % slides.length];
            incoming.classList.add('active');
            if (slides.length > 1) {
                incoming.classList.add('slide-entering');
                setTimeout(() => incoming.classList.remove('slide-entering'), transitionDuration);
            }
            currentSlideKey = incoming.dataset.slideKey || '';
            ensureSlideshow();
        }

        function ensureSlideshow(reset) {
            if (reset && slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
            if (displayMode === 'ticker') return;
            const slides = document.querySelectorAll('#main-stage .slide');
            if (slides.length < 2) {
                if (slideTimer) clearTimeout(slideTimer);
                slideTimer = null;
                return;
            }
            if (!slideTimer) {
                const duration = currentSlideKey === 'logo' ? logoSlideInterval : slideInterval;
                slideTimer = setTimeout(advanceSlide, duration);
            }
        }

        let dataUpdateInFlight = false;
        async function updateData() {
            if (dataUpdateInFlight) return;
            dataUpdateInFlight = true;
            if (dataPollTimer) { clearTimeout(dataPollTimer); dataPollTimer = null; }
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 20000);
            try {
                const res = await fetch('/api/data', {signal: controller.signal});
                if (!res.ok) throw new Error('Score API HTTP ' + res.status);
                const data = await res.json();
                if (!data || !Array.isArray(data.teams) || !Array.isArray(data.ticker_parts)) {
                    throw new Error('Invalid score response');
                }

                // Display preferences apply live; keep the current game and cached feed.
                settingsVersion = data.settings_updated_at || settingsVersion;
                browserRefreshSeconds = ScoreboardDisplay.duration(data.browser_refresh_seconds, 30, 30, 900);
                applyDisplayMode(data.display_mode);
                applyHeaderVisibility(data.header_visibility);
                if (appVersion && data.app_version && data.app_version !== appVersion) {
                    window.location.reload();
                    return;
                }
                appVersion = data.app_version || appVersion;

                // Apply slide transition class
                const trans = ['slide-right', 'slide-left', 'slide-top', 'slide-bottom', 'fade'].includes(data.slide_transition) ? data.slide_transition : 'slide-right';
                document.body.classList.remove('transition-slide-right', 'transition-slide-left', 'transition-slide-top', 'transition-slide-bottom', 'transition-fade');
                document.body.classList.add('transition-' + trans);

                const newInterval = ScoreboardDisplay.duration(data.slide_duration, 8, 1, 3600) * 1000;
                const newLogoInterval = ScoreboardDisplay.duration(data.logo_slide_duration, 8, 1, 3600) * 1000;
                const timingChanged = newInterval !== slideInterval || newLogoInterval !== logoSlideInterval;
                slideInterval = newInterval;
                logoSlideInterval = newLogoInterval;
                transitionDuration = ScoreboardDisplay.duration(data.transition_duration_ms, 500, 0, 2000);
                document.documentElement.style.setProperty('--transition-duration', transitionDuration + 'ms');
                if (timingChanged) ensureSlideshow(true);

                // Apply user-configured colors as CSS variables
                const colors = data.colors || {};
                const root = document.documentElement;
                root.style.setProperty('--live-color',         colors.live         || '#00E676');
                root.style.setProperty('--final-color',        colors.final        || '#FF1744');
                root.style.setProperty('--flash-color',        colors.flash        || '#FFD600');
                root.style.setProperty('--team-abbr-color',    colors.team_abbr    || '#ffffff');
                root.style.setProperty('--league-label-color', colors.league_label || '#099afc');
                root.style.setProperty('--ticker-base-color',  colors.ticker_base  || '#ffffff');
                root.style.setProperty('--winner-color',       colors.winner       || '#00E676');
                root.style.setProperty('--loser-color',        colors.loser        || '#FF1744');
                root.style.setProperty('--tie-color',          colors.tie_score    || '#FFD600');
                root.style.setProperty('--fav-abbr-color',     colors.fav_abbr     || '#F5A800');
                root.style.setProperty('--fav-score-color',    colors.fav_score    || '#F5A800');
                root.style.setProperty('--nascar-num-color',   colors.nascar_num   || '#FFD600');
                root.style.setProperty('--weather-color',      colors.weather      || '#dddddd');
                root.style.setProperty('--pre-time-color',     colors.pre_time     || '#ffffff');
                root.style.setProperty('--score-sep-color',    colors.score_sep    || '#888888');
                root.style.setProperty('--ticker-live-color',  colors.ticker_live  || colors.live || '#00E676');
                root.style.setProperty('--ticker-final-color', colors.ticker_final || colors.final || '#FF1744');
                root.style.setProperty('--ticker-sep-color',   colors.ticker_sep   || '#444444');
                root.style.setProperty('--race-pos-color',     colors.race_pos     || '#F5A800');
                root.style.setProperty('--race-laps-color',    colors.race_laps    || '#888888');
                root.style.setProperty('--card-subtext-color', colors.card_subtext || '#555555');

                // Surface colors (dark/light theme backgrounds, cards, borders)
                const isLight = data.theme === 'light';
                root.style.setProperty('--vs-color',     (isLight ? colors.light_vs : colors.dark_vs) || colors.vs_color || '#ffffff');
                root.style.setProperty('--bg',           colors.dark_bg         || '#080808');
                root.style.setProperty('--card-bg',      colors.dark_card       || '#111111');
                root.style.setProperty('--border',       colors.dark_border     || '#2a2a2a');
                root.style.setProperty('--ticker-bg',    colors.dark_ticker_bg  || '#000000');
                root.style.setProperty('--light-bg',     colors.light_bg        || '#c4d6f0');
                root.style.setProperty('--light-card',   colors.light_card      || '#ffffff');
                root.style.setProperty('--light-border', colors.light_border    || '#ffffff');

                // Previously-hardcoded elements (now user-configurable)
                root.style.setProperty('--header-bg-dark',      colors.header_bg_dark   || '#080808');
                root.style.setProperty('--header-bg-light',     colors.header_bg_light  || '#eef2f8');
                root.style.setProperty('--header-border-color', colors.header_border    || '#2a2a2a');
                root.style.setProperty('--card-border-color',   colors.card_border      || '#ffffff');
                root.style.setProperty('--logo-glow-color',     colors.logo_glow        || '#ffffff');
                root.style.setProperty('--ticker-border-color', colors.ticker_border    || '#099afc');
                root.style.setProperty('--final-badge-text',    colors.final_badge_text || '#ffffff');
                root.style.setProperty('--rss-label-color',     colors.rss_label        || '#ffffff');
                root.style.setProperty('--rss-event-color',     colors.rss_event        || '#ffffff');
                root.style.setProperty('--rss-subevent-color',  colors.rss_subevent     || '#888888');
                root.style.setProperty('--special-text-color',  colors.special_text     || '#cccccc');
                root.style.setProperty('--golf-pos-color',      colors.golf_pos         || '#F5A800');
                root.style.setProperty('--race-event-color',    colors.race_event       || '#666666');

                // Font family (applied live so a font change needs no reload)
                const fontPrimary = data.font_primary || 'Barlow Condensed';
                root.style.setProperty('--font-primary', `'${fontPrimary}', sans-serif`);
                applyFontLink(fontPrimary);
                if (document.fonts) document.fonts.ready.then(() => resetTickerAnimation());

                // Ticker top border: static configured color, or burn-in cycle
                applyTickerBorder(colors);

                // Header
                clockFormat = data.clock_format || '12h';
                clockTimezone = data.timezone || clockTimezone;
                updateClock();
                document.getElementById('display-name').innerText = data.display_name;
                document.getElementById('display-name').style.color = data.header_color;
                document.getElementById('top-clock').style.color = data.header_color;
                document.getElementById('header-sep').style.color = data.header_color;


                document.getElementById('weather').innerText = data.weather || '--';


                // Apply theme and orientation from settings
                document.body.classList.toggle('light', data.theme === 'light');
                applyOrientation(data.cast_orientation || 'auto');

                // Ticker speed (px/sec) — constant regardless of content width
                const newTickerSpeed = parseInt(data.ticker_speed, 10);
                if (newTickerSpeed > 0 && newTickerSpeed !== tickerSpeed) {
                    tickerSpeed = newTickerSpeed;
                }


                // ─── BUILD SLIDES ───
                // Collect slides into category buckets, then sort by slide_order
                const renderData = ScoreboardDisplay.renderValue(data);
                const catSlides = {};
                function addSlide(cat, html, teamKeys) {
                    const el = document.createElement('div');
                    el.innerHTML = html.trim();
                    const node = el.firstElementChild;
                    if (teamKeys) node.dataset.teamKeys = JSON.stringify(teamKeys);
                    if (!catSlides[cat]) catSlides[cat] = [];
                    catSlides[cat].push(node);
                }

                // Logo
                if (await logoAvailable(data)) addSlide('logo', `
                    <div class="slide" data-slide-key="logo" id="logo-slide">
                        <center><img src="/static/uploads/logo.png?v=${encodeURIComponent(data.logo_version || '')}" alt="Custom scoreboard logo" onerror="removeBadLogo(this)"></center>
                    </div>`);

                const flashIds = new Set();
                (renderData.teams || []).forEach((t, teamIndex) => {
                    const key = ScoreboardDisplay.gameKey(t);
                    const scoreNow = buildScoreText(t.away_score, t.home_score);
                    let doFlash = false;
                    if (!t.is_pre && previousScores[key] && previousScores[key] !== scoreNow) {
                        doFlash = true;
                        flashIds.add(key);
                    }
                    previousScores[key] = scoreNow;
                    if (displayMode === 'ticker') return;


                    const stateClass = t.color_state; // 'pre', 'live', 'final'
                    const flashAttr = doFlash ? 'data-flash="1"' : '';

                    // Determine win/loss/tie class for each side
                    const awayWinClass = !t.is_pre && t.winner === 'away' ? 'win'
                        : !t.is_pre && t.winner === 'home' ? 'loss'
                        : !t.is_pre && t.winner === 'tie'  ? 'tie' : '';
                    const homeWinClass = !t.is_pre && t.winner === 'home' ? 'win'
                        : !t.is_pre && t.winner === 'away' ? 'loss'
                        : !t.is_pre && t.winner === 'tie'  ? 'tie' : '';

                    // Fav team classes
                    const awayFavCls = t.away_is_fav ? 'fav-team-abbr' : '';
                    const homeFavCls = t.home_is_fav ? 'fav-team-abbr' : '';
                    const awayScoreFavCls = t.away_is_fav && !awayWinClass ? 'fav-team-score' : '';
                    const homeScoreFavCls = t.home_is_fav && !homeWinClass ? 'fav-team-score' : '';
                    const awayRank = ScoreboardDisplay.collegeRank(t.league_path, t.away_rank);
                    const homeRank = ScoreboardDisplay.collegeRank(t.league_path, t.home_rank);
                    const collegeFootball = t.league_path === 'football/college-football';
                    const periodTable = ScoreboardDisplay.renderPeriodTable(data.teams[teamIndex]);
                    const showRecords = Boolean(t.away_record || t.home_record);

                    let centerContent = '';
                    let statusContent = '';
                    let statusVContent = '';  // vertical-mode center row

                    const scheduledStatus = !t.game_state || t.game_state === 'scheduled' ? (t.local_time || t.status) : t.status;
                    if (t.is_pre) {
                        centerContent = `<div class="score-display pre vs-label">VS</div>`;
                        statusContent = `<div class="status-bar pre">${scheduledStatus}</div>`;
                        statusVContent = `<div class="status-v pre">${scheduledStatus}</div>`;
                    } else if (stateClass === 'live') {
                        centerContent = `
                            <div class="score-display live">
                                <span class="score-part ${awayWinClass} ${awayScoreFavCls}">${t.away_score}</span>
                                <span class="score-sep"> – </span>
                                <span class="score-part ${homeWinClass} ${homeScoreFavCls}">${t.home_score}</span>
                            </div>
                        `;
                        statusContent = `<div class="status-bar live"><span class="live-dot"></span>${t.status}</div>`;
                        statusVContent = `<div class="status-v live"><span class="live-dot"></span>${t.status}</div>`;
                    } else {
                        // Final
                        centerContent = `
                            <div class="score-display final">
                                <span class="score-part ${awayWinClass} ${awayScoreFavCls}">${t.away_score}</span>
                                <span class="score-sep"> – </span>
                                <span class="score-part ${homeWinClass} ${homeScoreFavCls}">${t.home_score}</span>
                            </div>
                        `;
                        statusContent = `<div class="status-bar final">${t.status || 'FINAL'}</div>`;
                        statusVContent = `<div class="status-v final">${t.status || 'FINAL'}</div>`;
                    }

                    const vEventTime = t.is_pre ? scheduledStatus : t.status;
                    const vLiveDot = stateClass === 'live' ? '<span class="live-dot"></span>' : '';
                    addSlide(t.league_path || 'teams', `
                        <div class="slide" data-slide-key="team:${key}" ${flashAttr}>
                            <div class="card ${stateClass} ${periodTable ? 'has-periods' : ''} ${doFlash ? 'flash' : ''}" id="card-${key.replace(/[^a-z0-9]/gi,'_')}">
                                ${stateClass === 'final' ? '<div class="final-badge">F</div>' : ''}
                                <div class="league-tag">${t.league_label}</div>
                                ${statusContent}
                                <div class="teams-grid">
                                    <div class="team-block away ${awayWinClass}">
                                        ${t.away_logo || awayRank ? `<div class="team-logo-lockup${awayRank ? ' ranked' : ''}">
                                            ${t.away_logo ? `<img src="${t.away_logo}" alt="" decoding="async" class="team-logo${t.away_is_fav ? ' fav-team-logo' : ''}" onerror="this.style.display='none'">` : ''}
                                            ${awayRank ? `<span class="team-rank-badge" aria-label="AP ranking ${awayRank}">#${awayRank}</span>` : ''}
                                        </div>` : ''}
                                        <span class="team-abbr ${awayFavCls}">${!collegeFootball && t.away_rank ? '#' + t.away_rank + ' ' : ''}${t.away_name}</span>
                                        ${showRecords ? `<span class="team-record ${awayFavCls}"${t.away_record ? '' : ' aria-hidden="true"'}>${t.away_record || ''}</span>` : ''}
                                        ${!t.is_pre ? `<span class="team-score-v ${stateClass} ${awayWinClass} ${awayScoreFavCls}">${t.away_score}</span>` : ''}
                                    </div>
                                    <div class="center-col">
                                        ${centerContent}
                                        ${statusVContent}
                                    </div>
                                    <div class="team-block home ${homeWinClass}">
                                        ${t.home_logo || homeRank ? `<div class="team-logo-lockup${homeRank ? ' ranked' : ''}">
                                            ${t.home_logo ? `<img src="${t.home_logo}" alt="" decoding="async" class="team-logo${t.home_is_fav ? ' fav-team-logo' : ''}" onerror="this.style.display='none'">` : ''}
                                            ${homeRank ? `<span class="team-rank-badge" aria-label="AP ranking ${homeRank}">#${homeRank}</span>` : ''}
                                        </div>` : ''}
                                        <span class="team-abbr ${homeFavCls}">${!collegeFootball && t.home_rank ? '#' + t.home_rank + ' ' : ''}${t.home_name}</span>
                                        ${showRecords ? `<span class="team-record ${homeFavCls}"${t.home_record ? '' : ' aria-hidden="true"'}>${t.home_record || ''}</span>` : ''}
                                        ${!t.is_pre ? `<span class="team-score-v ${stateClass} ${homeWinClass} ${homeScoreFavCls}">${t.home_score}</span>` : ''}
                                    </div>
                                </div>
                                ${periodTable}
                                <div class="v-event">
                                    <span class="v-event-league">${t.league_label}</span>
                                    <span class="v-event-time ${stateClass}">${vLiveDot}${vEventTime}</span>
                                </div>
                            </div>
                        </div>
                    `, [`${t.league_path}:${t.away_name}`, `${t.league_path}:${t.home_name}`]);
                });


                // ─── RACING SLIDES (NASCAR / IndyCar / F1) ───
                function ordSuffix(n) {
                    const num = parseInt(n);
                    if (isNaN(num)) return String(n);
                    const v = Math.abs(num) % 100;
                    return num + (['th','st','nd','rd'][(v-20)%10] || ['th','st','nd','rd'][v] || 'th');
                }

                (displayMode === 'ticker' ? [] : (renderData.races || [])).forEach(race => {
                    const sc = race.color_state;
                    const liveDot = sc === 'live' ? '<span class="live-dot"></span>' : '';
                    const favDriver = (race.drivers || []).find(d => d.is_fav) || (race.drivers || [])[0];

                    const flagColors = {Green:'#00E676', Yellow:'#FFD600', Red:'#FF1744', Checkered:'#ffffff', Caution:'#FFD600', Debris:'#FFD600', 'Pre-Race':'#888'};
                    const flagColor = flagColors[race.flag_label] || '#888';
                    const flagHtml = race.flag_label
                        ? `<span style="display:inline-block;margin-left:calc(8*var(--px));font-size:calc(10*var(--px));font-weight:900;letter-spacing:calc(2*var(--px));color:${flagColor};vertical-align:middle;">● ${race.flag_label.toUpperCase()}</span>`
                        : '';

                    const isOver = sc === 'final' || race.flag_label === 'Checkered';
                    const lapsRemaining = (race.laps_in_race > 0 && race.lap > 0) ? race.laps_in_race - race.lap : 0;
                    let lapsInfo = '';
                    if (isOver) {
                        lapsInfo = `<div class="race-laps-info done">🏁 FINAL</div>`;
                    } else if (race.lap > 0 && race.laps_in_race > 0) {
                        lapsInfo = `<div class="race-laps-info">LAP ${race.lap} / ${race.laps_in_race} &nbsp;·&nbsp; ${lapsRemaining} TO GO</div>`;
                    } else if (sc === 'pre') {
                        lapsInfo = `<div class="race-laps-info">${race.status}</div>`;
                    }

                    const statusBar = `<div class="status-bar ${sc}">${liveDot}${race.status}</div>`;

                    if (favDriver) {
                        const place = ordSuffix(favDriver.pos);
                        addSlide(race.league_path || 'racing', `
                            <div class="slide" data-slide-key="race:${race.league_label}:${race.race_name}:fav">
                                <div class="card ${sc}">
                                    ${isOver ? '<div class="final-badge">F</div>' : ''}
                                    <div class="league-tag">${race.league_label || 'NASCAR'}${flagHtml}</div>
                                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:calc(6*var(--px)) 0;gap:calc(4*var(--px));">
                                        <div class="score-display ${sc}">${place}</div>
                                        <div style="display:flex;align-items:center;gap:calc(14*var(--px));margin-top:calc(2*var(--px));">
                                            <span class="nascar-number">#${favDriver.car}</span>
                                            <span class="team-abbr">${favDriver.name}</span>
                                        </div>
                                        ${lapsInfo}
                                        <div class="card-subtext">${race.race_name}</div>
                                    </div>
                                    <div class="v-event">
                                        <span class="v-event-league">${race.league_label || 'NASCAR'}</span>
                                        <span class="v-event-time ${sc}">${liveDot}${favDriver.name} P${favDriver.pos} #${favDriver.car}</span>
                                    </div>
                                    ${statusBar}
                                </div>
                            </div>`);
                    }
                });

                // ─── GOLF SLIDES ───
                (displayMode === 'ticker' ? [] : (renderData.golf || [])).forEach(golf => {
                    const sc = golf.color_state;
                    const liveDot = sc === 'live' ? '<span class="live-dot"></span>' : '';
                    const statusBar = `<div class="status-bar ${sc}">${liveDot}${golf.status}</div>`;
                    const favGolfer = (golf.golfers || []).find(g => g.is_fav) || (golf.golfers || [])[0];

                    if (favGolfer) {
                        const isGolfOver = sc === 'final';
                        let holeInfo = '';
                        if (isGolfOver) {
                            holeInfo = `<div class="race-laps-info done">🏁 FINAL</div>`;
                        } else {
                            holeInfo = `<div class="race-laps-info">${golf.status}</div>`;
                        }
                        addSlide(golf.league_path || 'golf/pga', `
                            <div class="slide" data-slide-key="golf:${golf.tournament_name}:fav">
                                <div class="card ${sc}">
                                    ${isGolfOver ? '<div class="final-badge">F</div>' : ''}
                                    <div class="league-tag">PGA</div>
                                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:calc(6*var(--px)) 0;gap:calc(4*var(--px));">
                                        <div class="score-display ${sc}">${favGolfer.pos}</div>
                                        <div style="display:flex;align-items:center;gap:calc(14*var(--px));margin-top:calc(2*var(--px));">
                                            <span class="nascar-number">${favGolfer.strokes}</span>
                                            <span class="team-abbr">${favGolfer.name}</span>
                                        </div>
                                        ${holeInfo}
                                        <div class="card-subtext">${golf.tournament_name}</div>
                                    </div>
                                    <div class="v-event">
                                        <span class="v-event-league">PGA</span>
                                        <span class="v-event-time ${sc}">${liveDot}${favGolfer.name} ${favGolfer.pos} (${favGolfer.strokes})</span>
                                    </div>
                                    ${statusBar}
                                </div>
                            </div>`);
                    }
                });

                // ─── SPECIALS + LOCAL SCHEDULE ───
                (displayMode === 'ticker' ? [] : [...(renderData.specials || []), ...(renderData.local_schedule_items || [])]).forEach((sp, i) => {
                    const color = sp.color || '#F5A800';
                    if ((sp.type === 'image' && !sp.image) || (sp.type === 'url' && !sp.url)) return;
                    const specialEl = document.createElement('div');
                    specialEl.className = 'slide';
                    specialEl.dataset.slideKey = `special-${i}:${sp.type}:${sp.title || ''}:${sp.uid || ''}`;
                    if (sp.type === 'schedule') {
                        const dt = [sp.date, sp.time].filter(Boolean).join('  ·  ');
                        specialEl.innerHTML = `
                            <div class="card pre">
                                <div class="league-tag">${sp.label}</div>
                                ${dt ? `<div class="status-bar pre">${dt}</div>` : ''}
                                <div class="teams-grid">
                                    <div class="team-block away"><span class="team-abbr${sp.away_is_fav ? ' fav-team-abbr' : ''}">${sp.away_team}</span>${sp.away_record ? `<span class="team-record">${sp.away_record}</span>` : ''}</div>
                                    <div class="center-col"><div class="score-display pre vs-label">VS</div></div>
                                    <div class="team-block home"><span class="team-abbr${sp.home_is_fav ? ' fav-team-abbr' : ''}">${sp.home_team}</span>${sp.home_record ? `<span class="team-record">${sp.home_record}</span>` : ''}</div>
                                </div>
                                <div class="v-event">
                                    <span class="v-event-league">${sp.label}</span>
                                    ${dt ? `<span class="v-event-time pre">${dt}</span>` : ''}
                                </div>
                            </div>`;
                    } else if (sp.type === 'rss') {
                        const dateTime = [sp.date, sp.time].filter(Boolean).join('  ·  ');
                        const dt = dateTime && sp.date_kind === 'published' ? 'Published ' + dateTime : dateTime;
                        const logoHtml = sp.logo ? `<img src="${sp.logo}">` : '';
                        if (sp.is_matchup) {
                            specialEl.innerHTML = `
                                <div class="card pre rss-card rss-matchup">
                                    <div class="league-tag">${sp.tag || 'CUSTOM'}</div>
                                    ${dt ? `<div class="status-bar pre">${dt}</div>` : ''}
                                    <div class="teams-grid">
                                        <div class="team-block away"><span class="team-abbr${sp.away_is_fav ? ' fav-team-abbr' : ''}">${sp.away_team}</span>${sp.away_record ? `<span class="team-record">${sp.away_record}</span>` : ''}</div>
                                        <div class="center-col"><div class="score-display pre vs-label">VS</div></div>
                                        <div class="team-block home"><span class="team-abbr${sp.home_is_fav ? ' fav-team-abbr' : ''}">${sp.home_team}</span>${sp.home_record ? `<span class="team-record">${sp.home_record}</span>` : ''}</div>
                                    </div>
                                    <div class="rss-text-col">
                                        <div class="rss-event">${sp.title}</div>
                                        ${sp.body ? `<div class="rss-subevent">${sp.body}</div>` : ''}
                                    </div>
                                    ${dt ? `<div class="v-event"><span class="v-event-time pre">${dt}</span></div>` : ''}
                                </div>`;
                        } else {
                            specialEl.innerHTML = `
                                <div class="card pre rss-card">
                                    <div class="league-tag">${sp.tag || 'CUSTOM'}</div>
                                    ${dt ? `<div class="status-bar pre">${dt}</div>` : ''}
                                    <div class="rss-body">
                                        <div class="rss-logo-col">${logoHtml}<div class="rss-label">${sp.label}</div></div>
                                        <div class="rss-text-col">
                                            <div class="rss-event">${sp.title}</div>
                                            ${sp.body ? `<div class="rss-subevent">${sp.body}</div>` : ''}
                                        </div>
                                    </div>
                                    ${dt ? `<div class="v-event"><span class="v-event-time pre">${dt}</span></div>` : ''}
                                </div>`;
                        }
                    } else if (sp.type === 'image' && sp.image) {
                        specialEl.innerHTML = `
                            <div class="card special-card" style="border-color:${color};padding:0;overflow:hidden;">
                                <img src="${sp.image}" style="width:100%;height:100%;object-fit:contain;">
                            </div>`;
                    } else if (sp.type === 'url' && sp.url) {
                        specialEl.innerHTML = `
                            <div class="card" style="padding:0;overflow:hidden;border-color:#333;">
                                <iframe src="${sp.url}"
                                        style="width:100%;height:100%;border:none;display:block;"
                                        title="${sp.url_label || sp.url}"
                                        sandbox="allow-scripts allow-popups">
                                </iframe>
                            </div>`;
                    } else {
                        specialEl.innerHTML = `
                            <div class="card special-card" style="border-color:${color}">
                                <div class="special-title" style="color:${color}">${sp.title}</div>
                                ${sp.body ? `<div class="special-body">${sp.body}</div>` : ''}
                            </div>`;
                    }
                    const cat = sp.type === 'schedule' || sp.type === 'rss' ? 'local' : 'specials';
                    if (!catSlides[cat]) catSlides[cat] = [];
                    catSlides[cat].push(specialEl);
                });

                // ─── APPLY SLIDE PLAYLIST ORDER ───
                const playlist = renderData.slide_playlist || [];
                let orderedSlides;

                if (playlist.length) {
                    // Group collected slides by their category key
                    orderedSlides = [];
                    playlist.forEach(item => {
                        if (!item.key && item.type !== 'logo' && item.type !== 'local') return;
                        if (item.type === 'logo') {
                            orderedSlides.push(...(catSlides['logo'] || []));
                        } else if (item.type === 'team') {
                            // key = "league_path:abbr" — match by full team key
                            const path = item.key.slice(0, item.key.lastIndexOf(':'));
                            const abbr = item.key.slice(item.key.lastIndexOf(':') + 1);
                            (catSlides[path] || []).forEach(el => {
                                if (JSON.parse(el.dataset.teamKeys || '[]').includes(`${path}:${abbr}`)) {
                                    orderedSlides.push(el);
                                }
                            });
                        } else if (item.type === 'driver') {
                            const path = item.series || '';
                            (catSlides[path] || []).forEach(el => {
                                if (el.dataset.slideKey && el.dataset.slideKey.includes(item.name || '')) {
                                    orderedSlides.push(el);
                                }
                            });
                        } else if (item.type === 'golfer') {
                            (catSlides['golf/pga'] || []).forEach(el => {
                                if (el.dataset.slideKey && el.dataset.slideKey.includes(item.name || '')) {
                                    orderedSlides.push(el);
                                }
                            });
                        } else if (item.type === 'special') {
                            (catSlides['specials'] || []).forEach(el => {
                                // match by uid stored in slideKey or just add all in order
                                if (el.dataset.slideKey && item.uid && el.dataset.slideKey.includes(item.uid)) {
                                    orderedSlides.push(el);
                                }
                            });
                        } else if (item.type === 'local') {
                            orderedSlides.push(...(catSlides['local'] || []));
                        }
                    });
                    // Append any slides not matched by playlist (fallback)
                    const usedEls = new Set(orderedSlides);
                    Object.values(catSlides).flat().forEach(el => {
                        if (!usedEls.has(el)) orderedSlides.push(el);
                    });
                } else {
                    // No playlist — use category order (logo first, then everything else)
                    const orderedKeys = ['logo'];
                    Object.keys(catSlides).forEach(k => { if (!orderedKeys.includes(k)) orderedKeys.push(k); });
                    orderedSlides = [];
                    orderedKeys.forEach(cat => { if (catSlides[cat]) orderedSlides.push(...catSlides[cat]); });
                }

                orderedSlides = [...new Set(orderedSlides)];
                if (!orderedSlides.length) {
                    const empty = document.createElement('div');
                    empty.className = 'slide empty-slide';
                    empty.dataset.slideKey = 'empty';
                    empty.innerHTML = '<div class="empty-state"><strong>GAMEDAY</strong><span>No games in the selected window</span></div>';
                    orderedSlides.push(empty);
                }
                patchStage(orderedSlides);
                const activeGameKeys = new Set((renderData.teams || []).map(ScoreboardDisplay.gameKey));
                previousScores = Object.fromEntries(Object.entries(previousScores).filter(([key]) => activeGameKeys.has(key)));


                // ─── BUILD TICKER ───
                let tickerHtml = '';
                (renderData.ticker_parts || []).forEach(section => {
                    tickerHtml += `<span class="tick-item"><span class="tick-label">${section.label}</span></span>`;
                    (section.games || []).forEach((g, i) => {
                        const flash = flashIds.has(ScoreboardDisplay.gameKey(g));
                        const cls = flash ? 'flash-yellow' : g.color_state;
                        const awayRank = ScoreboardDisplay.collegeRank(g.league_path, g.away_rank);
                        const homeRank = ScoreboardDisplay.collegeRank(g.league_path, g.home_rank);
                        const collegeFootball = g.league_path === 'football/college-football';
                        const away = `${!collegeFootball && g.away_rank ? '#' + g.away_rank + ' ' : ''}${g.away || ''}`;
                        const home = `${!collegeFootball && g.home_rank ? '#' + g.home_rank + ' ' : ''}${g.home || ''}`;
                        const awayLogo = (g.away_logo ? `<img class="tick-logo" decoding="async" src="${g.away_logo}" alt="" onerror="this.hidden=true">` : '') +
                            (awayRank ? `<span class="tick-rank-badge" aria-label="AP ranking ${awayRank}">#${awayRank}</span>` : '');
                        const homeLogo = (g.home_logo ? `<img class="tick-logo" decoding="async" src="${g.home_logo}" alt="" onerror="this.hidden=true">` : '') +
                            (homeRank ? `<span class="tick-rank-badge" aria-label="AP ranking ${homeRank}">#${homeRank}</span>` : '');
                        let gameText;
                        if (g.away && g.home && g.color_state !== 'pre') {
                            const a = g.winner === 'away' ? `<strong>${away}</strong>` : away;
                            const h = g.winner === 'home' ? `<strong>${home}</strong>` : home;
                            const status = g.status || (g.color_state === 'final' ? 'FINAL' : '');
                            gameText = `${awayLogo}${a} <b>${g.away_score ?? '—'}</b> ${homeLogo}${h} <b>${g.home_score ?? '—'}</b> <small>${status}</small>`;
                        } else if (g.away && g.home) {
                            // Provider text includes the configured schedule time and event state.
                            const schedule = !g.game_state || g.game_state === 'scheduled' ? (g.local_time || g.text || g.status || '') : (g.status || g.text || '');
                            gameText = `${awayLogo}${away} @ ${homeLogo}${home} <small>${schedule}</small>`;
                        } else {
                            gameText = g.text || '';
                        }
                        tickerHtml += `<span class="tick-item ${cls}">${gameText}</span>`;
                        if (i < section.games.length - 1) tickerHtml += '<span class="tick-sep">·</span>';
                    });
                    tickerHtml += '<span class="tick-sep"> /// </span>';
                });

                function isToday(isoStr) {
                    return Boolean(isoStr) && ScoreboardDisplay.dayKey(isoStr, clockTimezone) === ScoreboardDisplay.dayKey(new Date(), clockTimezone);
                }
                (renderData.local_schedule_items || []).filter(i => i.type === 'schedule' && isToday(i.event_iso)).forEach(item => {
                    const dt = [item.date, item.time].filter(Boolean).join('   ');
                    const aTag = item.away_is_fav ? `<span class="fav-team-abbr">${item.away_team}</span>` : item.away_team;
                    const hTag = item.home_is_fav ? `<span class="fav-team-abbr">${item.home_team}</span>` : item.home_team;
                    tickerHtml += `<span class="tick-item"><span class="tick-label">${item.label}</span>${aTag} @ ${hTag}${dt ? ' | ' + dt : ''}</span><span class="tick-sep">  ///  </span>`;
                });
                (renderData.local_schedule_items || []).filter(i => i.type === 'rss' && isToday(i.event_iso)).forEach(item => {
                    const dateTime = [item.date, item.time].filter(Boolean).join('   ');
                    const dt = dateTime && item.date_kind === 'published' ? 'Published ' + dateTime : dateTime;
                    let text = item.title;
                    if (item.is_matchup) {
                        const aTag = item.away_is_fav ? `<span class="fav-team-abbr">${item.away_team}</span>` : item.away_team;
                        const hTag = item.home_is_fav ? `<span class="fav-team-abbr">${item.home_team}</span>` : item.home_team;
                        text = `${aTag} @ ${hTag}`;
                    }
                    tickerHtml += `<span class="tick-item"><span class="tick-label">${item.label}</span>${text}${dt ? ' | ' + dt : ''}</span><span class="tick-sep">  ///  </span>`;
                });

                tickerHtml = tickerHtml || '<span class="tick-item ticker-empty">No games in the selected window · Check favorites and leagues in Settings</span>';
                if (tickerHtml !== lastTickerHtml) {
                    lastTickerHtml = tickerHtml;
                    const ticker = tickerElement;
                    // Two identical adjacent segments create a continuous loop without
                    // the old empty viewport gap on long/ultrawide displays.
                    ticker.innerHTML = `<span class="ticker-segment">${tickerHtml}</span><span class="ticker-segment" aria-hidden="true">${tickerHtml}</span>`;
                    resetTickerAnimation();
                }
                lastSuccessfulFetch = Date.now();
                const connectionStatus = document.getElementById('connection-status');
                connectionStatus.textContent = data.cache_stale ? 'Sports feed interrupted · Scores may be outdated' : '';
                connectionStatus.hidden = !data.cache_stale;

            } catch(e) {
                console.warn('Keeping previous scoreboard data:', e);
                const status = document.getElementById('connection-status');
                status.textContent = lastSuccessfulFetch ? 'Connection interrupted · Showing saved scores' : 'Waiting for score service · Retrying automatically';
                status.hidden = false;
            } finally {
                clearTimeout(timeout);
                dataUpdateInFlight = false;
                dataPollTimer = setTimeout(updateData, browserRefreshSeconds * 1000);
            }
        }




        // Pixel-driven ticker: constant px/sec no matter the content width.
        let tickerTotal = 0;      // scrollWidth of the ticker (one full loop)
        let tickerLoopRAF = null;
        let tickerLoopLast = 0;

        function resetTickerAnimation() {
            const ticker = tickerElement;
            if (!ticker) return;
            const first = ticker.querySelector('.ticker-segment');
            tickerTotal = first ? first.getBoundingClientRect().width : ticker.scrollWidth;
            if (tickerTotal > 0) tickerOffset %= tickerTotal;
            if (displayMode === 'scoreboard' || document.hidden) {
                if (tickerLoopRAF) cancelAnimationFrame(tickerLoopRAF);
                tickerLoopRAF = null;
                return;
            }
            if (!tickerLoopRAF) {
                tickerLoopLast = 0;
                tickerLoopRAF = requestAnimationFrame(tickerLoop);
            }
        }

        function tickerLoop(ts) {
            tickerLoopRAF = null;
            if (displayMode === 'scoreboard' || document.hidden) return;
            const ticker = tickerElement;
            if (ticker && tickerTotal > 0) {
                if (!tickerLoopLast) tickerLoopLast = ts;
                const dt = Math.min((ts - tickerLoopLast) / 1000, 0.1);
                tickerLoopLast = ts;
                tickerOffset = (tickerOffset + tickerSpeed * dt) % tickerTotal;
                ticker.style.transform = `translate3d(${-tickerOffset}px, 0, 0)`;
            }
            tickerLoopRAF = requestAnimationFrame(tickerLoop);
        }

        document.addEventListener('visibilitychange', () => {
            resetTickerAnimation();
            if (!document.hidden) { ensureSlideshow(); updateData(); }
        });
        document.getElementById('ticker-text').addEventListener('load', resetTickerAnimation, true);
        if ('ResizeObserver' in window) {
            const tickerSizeObserver = new ResizeObserver(resetTickerAnimation);
            tickerSizeObserver.observe(document.getElementById('main-footer'));
        }

        updateData();
        resetTickerAnimation(); // animate initial "LOADING..." text
    </script>
</body>
</html>
